<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06172e" />
  <title>BandCenter | Barking Battalion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="bandcenter.css" />
  <link rel="stylesheet" href="bandcenter-v2.css?v=12" />
  <link rel="stylesheet" href="bandcenter-store.css?v=12" />
  <link rel="stylesheet" href="bandcenter-bracket.css?v=12" />
  <link rel="stylesheet" href="bandcenter-history.css?v=12" />
  <link rel="stylesheet" href="bandcenter-dynamic.css?v=12" />
  <style>
    #boot-status{font-family:Inter,system-ui,sans-serif;max-width:760px;margin:72px auto;padding:28px;border-radius:18px;background:#06172e;color:#fff;box-shadow:0 18px 55px rgba(0,0,0,.18)}
    #boot-status h1{margin:0 0 8px;font-size:32px}#boot-status p{margin:7px 0;color:#c9d8ec;line-height:1.55}
    #boot-status.error{background:#4b0d16}#boot-status code{display:block;white-space:pre-wrap;background:rgba(255,255,255,.1);padding:12px;border-radius:10px;margin-top:14px;color:#fff}
  </style>
</head>
<body>
  <div id="root">
    <div id="boot-status"><h1>BandCenter</h1><p>Loading the Beginning Band Championship Series…</p></div>
  </div>

  <script>
    function showBootError(message){
      var root=document.getElementById('root');
      root.innerHTML='<div id="boot-status" class="error"><h1>BandCenter startup error</h1><p>The app could not finish loading. Copy the message below and send it to Mr. A / Lyra.</p><code></code></div>';
      root.querySelector('code').textContent=String(message||'Unknown startup error');
    }
    window.addEventListener('error',function(e){showBootError(e.error&&e.error.stack?e.error.stack:(e.message||'Browser script error'));});
    window.addEventListener('unhandledrejection',function(e){showBootError(e.reason&&e.reason.stack?e.reason.stack:e.reason);});
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  <script src="bandcenter-config.js"></script>
  <script src="bandcenter-ensembles.js?v=12"></script>
  <script src="bandcenter-store-patch.js?v=12"></script>
  <script src="bandcenter-bracket-patch.js?v=12"></script>
  <script src="bandcenter-bracket-fix.js?v=12"></script>
  <script src="bandcenter-tournament-management-patch.js?v=12"></script>
  <script src="bandcenter-history-rankings-patch.js?v=12"></script>
  <script src="bandcenter-history-fix.js?v=12"></script>
  <script src="bandcenter-dynamic-patch.js?v=12"></script>
  <script src="bandcenter-dynamic-fix.js?v=12"></script>
  <script src="bandcenter-v12-assert.js?v=12"></script>
  <script src="bandcenter-wording-fix.js?v=12"></script>
  <script>
    (async function bootBandCenter(){
      try{
        if(!window.React) throw new Error('React failed to load from the CDN.');
        if(!window.ReactDOM) throw new Error('ReactDOM failed to load from the CDN.');
        if(!window.Babel) throw new Error('Babel failed to load from the CDN.');
        const response=await fetch('./bandcenter-app.js?v=12',{cache:'no-store'});
        if(!response.ok) throw new Error('Could not load bandcenter-app.js (HTTP '+response.status+').');
        let source=await response.text();
        if(!source.trim()) throw new Error('bandcenter-app.js loaded but was empty.');
        if(window.BANDCENTER_PATCH_SOURCE)source=window.BANDCENTER_PATCH_SOURCE(source);
        const compiled=Babel.transform(source,{
          plugins:[["transform-react-jsx",{runtime:"classic"}]],
          sourceType:'script'
        }).code;
        if(/\brequire\s*\(/.test(compiled)) throw new Error('Browser build unexpectedly contains CommonJS require().');
        (0,eval)(compiled);
      }catch(err){
        console.error('BandCenter boot failed',err);
        showBootError(err&&err.stack?err.stack:err);
      }
    })();
  </script>
</body>
</html>
